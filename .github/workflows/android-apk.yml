name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Configure Firebase Android app
        env:
          ANDROID_GOOGLE_SERVICES_JSON: ${{ secrets.ANDROID_GOOGLE_SERVICES_JSON }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const configText = process.env.ANDROID_GOOGLE_SERVICES_JSON;
          if (!configText) {
            throw new Error('Set the ANDROID_GOOGLE_SERVICES_JSON repository Actions secret to the Android google-services.json contents.');
          }
          const config = JSON.parse(configText);
          const packageNames = (config.client ?? []).map(
            (client) => client.client_info?.android_client_info?.package_name,
          );
          if (!packageNames.includes('gala.nanaman.app')) {
            throw new Error('The Android Firebase config must include package gala.nanaman.app.');
          }
          fs.writeFileSync('android/app/google-services.json', configText);
          NODE

      - name: Install dependencies and build web assets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_USE_EMULATORS: 'false'
        run: |
          if [ -z "$VITE_FIREBASE_API_KEY" ] || [ -z "$VITE_FIREBASE_AUTH_DOMAIN" ] || [ -z "$VITE_FIREBASE_PROJECT_ID" ] || [ -z "$VITE_FIREBASE_APP_ID" ]; then
            echo "::error::Set VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID, and VITE_FIREBASE_APP_ID as GitHub Actions secrets."
            exit 1
          fi
          node scripts/check-lockfile.mjs
          npm ci --registry=https://registry.npmjs.org/
          npm run mobile:sync:android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: gala-nanaman-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
